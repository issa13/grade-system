# يبني تطبيق أندرويد على أجهزة GitHub — لا تحتاج Android Studio لهذا.
# مع كل push إلى main (أو زر «Run workflow» في تبويب Actions) يصنع:
#   • grades-android-test-apk   → ملف .apk تثبّته على أي تلفون أندرويد للتجربة
#   • grades-android-play-store → ملف .aab موقّع لـ Google Play (فقط بعد إضافة
#     الـ secrets الأربعة للتوقيع — الشرح في MOBILE.md، الجزء 5)
# تجدهما أسفل صفحة الـ run بعد انتهائه (تبويب Actions).
#
# يستعمل نفس متغيّرات الموقع (Settings ← Secrets and variables ← Actions ← Variables):
#   NEXT_PUBLIC_SUPABASE_URL و NEXT_PUBLIC_SUPABASE_ANON_KEY

name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "supabase/**"

concurrency:
  group: android-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GS_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install the website's packages
        run: npm ci

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Build the website and copy it into the app
        working-directory: mobile
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run sync

      - name: Build the test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "grades-${{ github.run_number }}.apk"

      - name: Upload the test APK
        uses: actions/upload-artifact@v5
        with:
          name: grades-android-test-apk
          path: mobile/android/grades-${{ github.run_number }}.apk
          retention-days: 30

      # ---- Google Play: يُتخطّى حتى تضيف secrets التوقيع ----
      - name: Prepare the signing key
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > grades-release.jks
          {
            echo "storeFile=grades-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the Google Play bundle
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile/android
        run: |
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "grades-${{ github.run_number }}.aab"

      - name: Upload the Google Play bundle
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v5
        with:
          name: grades-android-play-store
          path: mobile/android/grades-${{ github.run_number }}.aab
          retention-days: 30

      - name: Remove the signing key from the build machine
        if: always()
        working-directory: mobile/android
        run: rm -f grades-release.jks keystore.properties
